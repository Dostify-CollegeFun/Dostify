<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dostify — Apne Log, Apni Duniya.</title>
<meta name="theme-color" content="#0b1020">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💜%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ff;--card:#fff;--card2:#efeaff;--tx:#1a1633;--mut:#6b6788;--bd:#e2dbfa;--p:#7c3aed;--i:#4f46e5;--danger:#e11d48}
:root[data-theme=dark]{--bg:#0b1020;--card:#121933;--card2:#1b2347;--tx:#eef0ff;--mut:#9aa3c7;--bd:#262f55}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--card2);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.pri{background:linear-gradient(135deg,var(--p),var(--i));color:#fff}
.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.ic{background:none;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--mut);padding:6px;border-radius:8px}
.ic:hover{background:var(--card2)}
.ic.on{color:var(--danger)}.ic.on svg{fill:currentColor}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;outline:0;resize:vertical}
input:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px #7c3aed33}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-top:12px}
label input,label textarea{margin-top:4px;color:var(--tx);font-weight:400}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}
.mut{color:var(--mut);font-size:13px}.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:20px;border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:6px}
.logo{font-weight:800;font-size:26px;letter-spacing:-.03em;background:linear-gradient(135deg,var(--p),var(--i));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:14px}
.nl{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;font-weight:600;color:var(--mut);border:0;background:none;cursor:pointer;width:100%}
.nl.on,.nl:hover{background:var(--card2);color:var(--tx)}
main{max-width:680px;width:100%;margin:0 auto;padding:20px 16px 90px}main.w{max-width:980px}
.bn{display:none}
.split{display:grid;grid-template-columns:300px 1fr;gap:12px;height:calc(100vh - 60px)}
.pane{display:flex;flex-direction:column;padding:0;overflow:hidden;margin:0}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:12px}
.m{max-width:78%;padding:8px 12px;border-radius:16px;background:var(--card2);align-self:flex-start;word-break:break-word;white-space:pre-wrap}
.m.me{align-self:flex-end;background:linear-gradient(135deg,var(--p),var(--i));color:#fff}
.t{font-size:10px;opacity:.7}.t button{background:none;border:0;color:inherit;cursor:pointer;font-size:10px;text-decoration:underline}
.item{padding:10px;border-radius:12px}.item:hover{background:var(--card2)}
.unread{width:10px;height:10px;border-radius:50%;background:var(--p);flex:none}
.bk{display:none;font-size:22px}
.chip{display:inline-block;background:var(--card2);border-radius:99px;padding:2px 10px;font-size:12px;margin:2px}
.sk{height:14px;border-radius:8px;background:linear-gradient(90deg,var(--card2),var(--bd),var(--card2));background-size:200% 100%;animation:sh 1.2s infinite;margin:8px 0}
@keyframes sh{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:99;animation:up .25s;max-width:90vw}
.toast.bad{background:var(--danger);color:#fff}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}}
.off{background:#f59e0b;color:#111;text-align:center;padding:6px;font-size:13px;position:sticky;top:0;z-index:9}
.land{max-width:1000px;margin:0 auto;padding:20px 20px 60px}
.hero{padding:72px 0 48px;text-align:center}
.hero h1{font-size:clamp(38px,8vw,68px);line-height:1.05;letter-spacing:-.04em;font-weight:800}
.hero p{max-width:520px;margin:18px auto 26px;color:var(--mut);font-size:17px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.auth{max-width:400px;margin:8vh auto;padding:0 16px}
@media(max-width:760px){
.shell{display:block}aside{display:none}
.bn{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
.bn .nl{flex-direction:column;gap:2px;font-size:11px;padding:6px 14px;width:auto}
.split{grid-template-columns:1fr;height:calc(100vh - 150px)}
.split.has .lst{display:none}.split:not(.has) .pane{display:none}.bk{display:inline}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.callbar{display:flex;gap:5px;margin-left:auto}.callbtn{border:0;border-radius:10px;padding:7px 9px;background:var(--card2);cursor:pointer;font-weight:700}.callbtn.video{background:#16a34a;color:#fff}.callbtn.audio{background:#2563eb;color:#fff}
</style>
</head>
<body>
<div id="app"></div>
<div id="boot" style="max-width:420px;margin:12vh auto;padding:0 16px;font:15px/1.5 system-ui,sans-serif;color:#8b88a8;text-align:center"><b style="font-size:30px;color:#7c3aed">Dostify</b><p id="bootmsg">Loading…</p></div>

<script>

<script type="module">
import {html,render,useState,useEffect,useRef} from "https://unpkg.com/htm@3.1.1/preact/standalone.module.js";

import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,getDoc,getDocs,setDoc,updateDoc,deleteDoc,addDoc,query,where,orderBy,limit,startAfter,onSnapshot,serverTimestamp,writeBatch,increment,Timestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ====== Firebase Web App configuration ====== */
const firebaseConfig = {
  apiKey: "AIzaSyAaqoZ8MyqMgOsfxBuKdVbvAAFqyXLZGmU",
  authDomain: "dostify-fun.firebaseapp.com",
  projectId: "dostify-fun",
  messagingSenderId: "1018690360513",
  appId: "1:1018690360513:web:d4375ca108282ae1113040",
  measurementId: "G-VH8N2RVPRB"
};

// LiveKit: the API key is only an identifier. Keep the API SECRET on a backend, never in HTML.
const LIVEKIT_API_KEY = "APInkbyaWRTX4vr";
const LIVEKIT_URL = "wss://YOUR_PROJECT.livekit.cloud";
const LIVEKIT_TOKEN_ENDPOINT = "https://YOUR_BACKEND_DOMAIN/api/livekit-token";
const OK = Boolean(firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith("YOUR"));
let auth, db;
if (OK) {
  // Initialize Firebase exactly once; reuse this app for Auth and Firestore.
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = initializeFirestore(app, {
    localCache: persistentLocalCache({
      tabManager: persistentMultipleTabManager()
    })

}
/* ============================================ */

/* ---------- helpers ---------- */
const root=document.documentElement;
try{root.dataset.theme=localStorage.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch{root.dataset.theme='dark'}
const flip=()=>{const n=root.dataset.theme==='dark'?'light':'dark';root.dataset.theme=n;try{localStorage.theme=n}catch{}};
const nav=p=>{location.hash='#'+p};
const toast=(m,bad)=>{const e=document.createElement('div');e.className='toast'+(bad?' bad':'');e.setAttribute('role','status');e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),3400)};
const err=e=>({'auth/invalid-credential':'Wrong email or password.','auth/email-already-in-use':'That email is already registered. Try logging in.','auth/weak-password':'Password must be at least 6 characters.','auth/invalid-email':'Enter a valid email address.','auth/popup-closed-by-user':'Google sign-in was cancelled.','auth/too-many-requests':'Too many attempts. Wait a bit and try again.','auth/unauthorized-domain':'Add this website domain in Firebase → Authentication → Settings → Authorized domains.'}[e.code]||(e.code==='permission-denied'?'Not allowed by the security rules.':e.message||'Something went wrong.'));
const ago=t=>{const m=t?.toMillis?.();if(!m)return'now';const s=(Date.now()-m)/1e3;return s<60?'now':s<3600?Math.floor(s/60)+'m':s<86400?Math.floor(s/3600)+'h':new Date(m).toLocaleDateString()};
const pair=(a,b)=>a<b?a+'_'+b:b+'_'+a;
// Media is stored inline as a data URL in Firestore (no Firebase Storage). Firestore documents are limited to 1 MiB, so files must be small.
const blobToDataURL=blob=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('Could not read this file.'));r.readAsDataURL(blob)});
const mediaToFirestoreDataURL=async file=>{
 if(!file)throw new Error('Choose a photo or video first.');
 if(file.type.startsWith('image/')){
  let bmp;try{bmp=await createImageBitmap(file)}catch{throw new Error('This photo format is not supported. Try JPG or PNG.')}
  const scale=Math.min(1,1280/Math.max(bmp.width,bmp.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bmp.width*scale));canvas.height=Math.max(1,Math.round(bmp.height*scale));
  const ctx=canvas.getContext('2d');ctx.drawImage(bmp,0,0,canvas.width,canvas.height);bmp.close?.();
  for(const quality of [.82,.72,.62,.52,.42,.32]){const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',quality));if(blob&&blob.size<=420*1024)return await blobToDataURL(blob)}
  throw new Error('Could not compress this photo enough. Try a smaller image.');
 }
 if(/^video\/(mp4|webm|quicktime)$/.test(file.type)){
  if(file.size>350*1024)throw new Error('Firestore-only video limit is 350 KB per clip. Please trim/compress it first; Firestore has a 1 MiB document limit.');
  const data=await blobToDataURL(file);if(data.length>850000)throw new Error('This video is too large for Firestore. Please use a smaller clip.');return data;
 }
 throw new Error('Use a photo (JPG/PNG/WebP/GIF) or a small MP4/MOV/WEBM video.');
};
const UC={};const gu=i=>UC[i]||(UC[i]=getDoc(doc(db,'users',i)).then(s=>s.data()).catch(()=>{delete UC[i]}));
const users=ids=>Promise.all(ids.map(gu));
const useU=i=>{const[u,s]=useState();useEffect(()=>{if(i)gu(i).then(s)},[i]);return u};
const P={home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',msg:'<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',heart:'<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.1 3 5.5l7 7Z"/>',send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',edit:'<path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>'};
const Ic=(n,s=20)=>html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" dangerouslySetInnerHTML=${{__html:P[n]}}/>`;
const Av=({n,s=40,photo})=>{const c=[...(n||'?')].reduce((a,x)=>a+x.charCodeAt(0),0)%360;return photo?html`<img class="av" src=${photo} alt=${(n||'User')+' profile photo'} style="width:${s}px;height:${s}px;object-fit:cover;border-radius:50%"/>`:html`<div class="av" style="width:${s}px;height:${s}px;font-size:${s*.4}px;background:linear-gradient(135deg,hsl(${c} 70% 55%),hsl(${(c+50)%360} 70% 42%))">${(n||'?')[0].toUpperCase()}</div>`};
const Sk=()=>html`<div><div class="sk" style="width:60%"></div><div class="sk"></div><div class="sk" style="width:80%"></div></div>`;
const Fld=(l,v,on,o={})=>html`<label>${l}${o.ta?html`<textarea rows="3" maxlength="200" value=${v} onInput=${on}></textarea>`:html`<input type=${o.type||'text'} required=${!!o.req} maxlength="100" autocomplete=${o.ac||'off'} value=${v} onInput=${on}/>`}</label>`;
const URow=({u,children})=>html`<div class="row" style="padding:8px 0"><${Av} n=${u.name} photo=${u.photo}/><a href="#/profile/${u.username}" class="sp"><b>${u.name}</b><div class="mut ell">@${u.username}${u.college?' · '+u.college:''}</div></a>${children}</div>`;
const openChat=async(me,o)=>{const id=pair(me,o),r=doc(db,'chats',id);try{if(!(await getDoc(r)).exists())await setDoc(r,{members:[me,o],type:'direct',createdAt:serverTimestamp(),lastAt:serverTimestamp(),lastMessage:'',lastSender:'',lastRead:{},typing:{}});nav('/messages/'+id)}catch(e){toast(err(e),1)}};

/* ---------- public pages ---------- */
const Landing=()=>html`<div class="land"><header class="row"><b class="logo" style="margin:0">Dostify</b><span class="sp"></span><a class="btn sm" href="#/login">Log in</a><a class="btn sm pri" href="#/signup">Sign up</a></header>
<section class="hero"><h1>Apne Log, Apni Duniya.</h1><p>The social network for college students. Post to your campus feed, add friends, and chat in real time.</p><div class="row" style="justify-content:center"><a class="btn pri" href="#/signup">Create your account</a><a class="btn" href="#/login">I already have one</a></div></section>
<section class="feat">${[['Campus feed','Share what is on your mind and see what your batch is talking about.'],['Real-time chat','Message friends instantly, with typing and seen indicators.'],['Friends first','Send requests, build your circle, and chat only with people you added.'],['Rules-enforced privacy','Firestore Security Rules decide who can read and write. Messages are not end-to-end encrypted.']].map(([t,d])=>html`<div class="card"><b>${t}</b><p class="mut">${d}</p></div>`)}</section></div>`;

const T={login:['Welcome back','Log in'],signup:['Create your account','Sign up'],forgot:['Reset your password','Send reset link']};
function Auth({mode}){
 const [e,setE]=useState(''),[p,setP]=useState(''),[b,setB]=useState(false);
 const go=async ev=>{ev.preventDefault();setB(true);try{
  if(mode==='login')await signInWithEmailAndPassword(auth,e,p);
  else if(mode==='signup')await createUserWithEmailAndPassword(auth,e,p);
  else{await sendPasswordResetEmail(auth,e);toast('Reset link sent. Check your inbox.')}
 }catch(x){toast(err(x),1)}setB(false)};
 const g=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(x){toast(err(x),1)}};
 return html`<div class="auth"><a href="#/" class="logo">Dostify</a><form class="card" onSubmit=${go}><h2>${T[mode][0]}</h2>
 ${Fld('Email',e,x=>setE(x.target.value),{type:'email',req:1,ac:'email'})}
 ${mode!=='forgot'&&Fld('Password',p,x=>setP(x.target.value),{type:'password',req:1,ac:mode==='login'?'current-password':'new-password'})}
 <button class="btn pri" style="width:100%;margin-top:16px" disabled=${b}>${b?'Please wait…':T[mode][1]}</button>
 ${mode!=='forgot'&&html`<button type="button" class="btn" style="width:100%;margin-top:8px" onClick=${g}>Continue with Google</button>`}
 <p class="mut" style="margin-top:14px">${mode==='login'?html`New here? <a href="#/signup"><b>Sign up</b></a> · <a href="#/forgot"><b>Forgot password?</b></a>`:html`Back to <a href="#/login"><b>Log in</b></a>`}</p></form></div>`;
}

function Onboard({u,done}){
 const [f,setF]=useState({username:'',name:u.displayName||'',college:'',course:'',interests:''}),[b,setB]=useState(false);
 const s=k=>e=>setF({...f,[k]:e.target.value});
 const go=async e=>{e.preventDefault();const un=f.username.trim().toLowerCase();
  if(!/^[a-z0-9_]{3,20}$/.test(un))return toast('Username must be 3–20 characters: a–z, 0–9 or underscore.',1);
  setB(true);
  try{const ub=doc(db,'usernames',un);if((await getDoc(ub)).exists())throw{message:'That username is already taken.'};
   const d={uid:u.uid,username:un,name:(f.name.trim()||un).slice(0,50),bio:'',college:f.college.trim().slice(0,80),course:f.course.trim().slice(0,80),interests:f.interests.split(',').map(x=>x.trim()).filter(Boolean).slice(0,10)};
   const w=writeBatch(db);w.set(ub,{uid:u.uid});w.set(doc(db,'users',u.uid),{...d,createdAt:serverTimestamp()});await w.commit();
   UC[u.uid]=Promise.resolve(d);done({...d,createdAt:null});
  }catch(x){toast(err(x),1)}setB(false)};
 return html`<div class="auth"><span class="logo">Dostify</span><form class="card" onSubmit=${go}><h2>Set up your profile</h2><p class="mut">Your username is permanent and unique.</p>
 ${Fld('Username',f.username,s('username'),{req:1})}${Fld('Display name',f.name,s('name'),{req:1})}${Fld('College',f.college,s('college'))}${Fld('Course',f.course,s('course'))}${Fld('Interests (comma separated)',f.interests,s('interests'))}
 <button class="btn pri" style="width:100%;margin-top:16px" disabled=${b}>${b?'Saving…':'Join Dostify'}</button>
 <button type="button" class="btn sm" style="margin-top:8px" onClick=${()=>signOut(auth)}>Log out</button></form></div>`;
}

/* ---------- feed ---------- */
function Post({p,pf,upd,del}){
 const [open,setOpen]=useState(false),[cs,setCs]=useState(null),[c,setC]=useState('');
 const mine=p.uid===pf.uid;
 const like=async()=>{const b=writeBatch(db),lr=doc(db,'posts',p.id,'likes',pf.uid),pr=doc(db,'posts',p.id),d=p.liked?-1:1;
  if(p.liked)b.delete(lr);else b.set(lr,{at:serverTimestamp()});
  b.update(pr,{likeCount:increment(d)});
  try{await b.commit();upd({liked:!p.liked,likeCount:p.likeCount+d})}catch(e){toast(err(e),1)}};
 const toggle=async()=>{setOpen(!open);if(!cs){try{const s=await getDocs(query(collection(db,'posts',p.id,'comments'),orderBy('createdAt'),limit(30)));setCs(s.docs.map(d=>({id:d.id,...d.data()})))}catch(e){toast(err(e),1);setCs([])}}};
 const addC=async e=>{e.preventDefault();const x=c.trim();if(!x)return;try{const r=await addDoc(collection(db,'posts',p.id,'comments'),{uid:pf.uid,username:pf.username,text:x,createdAt:serverTimestamp()});setCs([...cs,{id:r.id,uid:pf.uid,username:pf.username,text:x}]);setC('')}catch(e){toast(err(e),1)}};
 const delC=async id=>{if(!confirm('Delete this comment?'))return;try{await deleteDoc(doc(db,'posts',p.id,'comments',id));setCs(cs.filter(x=>x.id!==id))}catch(e){toast(err(e),1)}};
 const ed=async()=>{const x=prompt('Edit your post',p.text);if(x===null||!x.trim())return;try{await updateDoc(doc(db,'posts',p.id),{text:x.trim().slice(0,1000),edited:true});upd({text:x.trim().slice(0,1000),edited:true})}catch(e){toast(err(e),1)}};
 const rm=async()=>{if(!confirm('Delete this post?'))return;try{await deleteDoc(doc(db,'posts',p.id));del()}catch(e){toast(err(e),1)}};

 if(u===undefined)return html`<div class="card"><${Sk}/></div>`;

 ${Fld('Display name',f.name,s('name'),{req:1})}${Fld('Bio',f.bio,s('bio'),{ta:1})}${Fld('College',f.college,s('college'))}${Fld('Course',f.course,s('course'))}${Fld('Interests (comma separated)',f.interests,s('interests'))}
 <div class="row" style="margin-top:16px"><button class="btn pri" disabled=${b}>${b?'Saving…':'Save changes'}</button><button type="button" class="btn" onClick=${()=>{setEd(false);setPhoto('')}}>Cancel</button></div></form>`;
 return html`<div class="card"><div class="row"><${Av} n=${u.name} s=${72} photo=${u.photo}/><div class="sp"><h2>${u.name}</h2><div class="mut">@${u.username}</div></div>
 ${mine?html`<button class="btn sm" onClick=${()=>{setF({name:u.name,bio:u.bio||'',college:u.college||'',course:u.course||'',interests:(u.interests||[]).join(', '),removePhoto:false});setPhoto('');setEd(true)}}>Edit profile</button>`:html`<a class="btn sm pri" href="#/friends">Find in Friends</a>`}</div>
 <p style="margin:14px 0;white-space:pre-wrap">${u.bio||(mine?'Add a short bio so people know who you are.':'')}</p>
 <div class="mut">${[u.college,u.course].filter(Boolean).join(' · ')}</div><div style="margin:8px 0">${(u.interests||[]).map(i=>html`<span class="chip">${i}</span>`)}</div>
 <div class="mut">Joined ${u.createdAt?.toMillis?new Date(u.createdAt.toMillis()).toLocaleDateString():'just now'}</div>${mine&&html`<button class="btn" style="margin-top:16px;width:100%" onClick=${async()=>{try{await signOut(auth);nav('/login')}catch(e){toast(err(e),1)}}}>${Ic('out')} Log out</button>`}</div>`;

function Shell({pf,r,children}){
 const items=[['/home','home','Home'],['/friends','users','Friends'],['/messages','msg','Messages'],['/profile/'+pf.username,'user','Profile']];
 const on=p=>r.split('/')[1]===p.split('/')[1]||(!r.split('/')[1]&&p==='/home');
 const link=([p,i,l])=>html`<a key=${p} href="#${p}" class="nl ${on(p)?'on':''}" aria-label=${l}>${Ic(i)}<span>${l}</span></a>`;
 return html`<div class="shell"><aside><span class="logo">Dostify</span>${items.map(link)}<span class="sp"></span><button class="nl" onClick=${flip}>${Ic('moon')}<span>Theme</span></button><button class="nl" onClick=${()=>signOut(auth)}>${Ic('out')}<span>Log out</span></button></aside>
 <main class=${r.startsWith('/messages')?'w':''}>${children}</main><nav class="bn">${items.map(link)}<button class="nl" aria-label="Log out" onClick=${async()=>{try{await signOut(auth);nav('/login')}catch(e){toast(err(e),1)}}}>${Ic('out')}<span>Logout</span></button></nav></div>`;

 useEffect(()=>onAuthStateChanged(auth,async x=>{setPf(undefined);setU(x);if(x){try{const s=await getDoc(doc(db,'users',x.uid));setPf(s.exists()?s.data():null)}catch(e){toast(err(e),1);setPf(null)}}}),[]);
 const [p0,p1]=r.split('/').filter(Boolean),pub=['','login','signup','forgot'].includes(p0||'');

 else if(pf===null)pg=html`<${Onboard} u=${u} done=${setPf}/>`;
 else pg=html`<${Shell} pf=${pf} r=${r}>${p0==='friends'?html`<${Friends} pf=${pf}/>`:p0==='messages'?html`<${Messages} pf=${pf} id=${p1}/>`:p0==='profile'?html`<${Profile} key=${p1} pf=${pf} setPf=${setPf} un=${p1||pf.username}/>`:html`<${Home} pf=${pf}/>`}<//>`;
 return html`<div>${banner}${pg}</div>`;

==================== SETUP (5 minutes) ====================
1. console.firebase.google.com → Add project → Add a Web app (</>) → copy the config into `firebaseConfig` above.
2. Build → Authentication → Get started → enable "Email/Password" and "Google".
   Authentication → Settings → Authorized domains → add YOUR_USERNAME.github.io (and localhost for testing).
3. Build → Firestore Database → Create database (production mode). Publish the Firestore rules below. No Firebase Storage is used: photos are compressed in the browser and saved as data URLs in Firestore; videos are limited to 350 KB because each Firestore document has a 1 MiB limit.
4. GitHub: new repo → upload this file named index.html → Settings → Pages → Deploy from branch (main, / root).
   Local test: run `python3 -m http.server` in this folder and open http://localhost:8000 (opening the file directly will not work).
5. Billing: the free Spark plan is enough to start. In Google Cloud Console → Billing → Budgets & alerts, add an alert if you ever upgrade.
6. LiveKit: set LIVEKIT_URL and LIVEKIT_TOKEN_ENDPOINT above. Build a server-side token endpoint that verifies Firebase ID tokens and creates LiveKit access tokens using the API SECRET stored in server environment variables. Never place the API SECRET in this HTML. This file adds outgoing call buttons; incoming-call accept/reject and notification flow still require implementation.
   No composite indexes are needed for the queries in this file.

==================== FIRESTORE SECURITY RULES ====================
rules_version = '2';
service cloud.firestore {
 match /databases/{database}/documents {
  function me() { return request.auth.uid; }
  function signedIn() { return request.auth != null; }
  function pairId(m) { return m[0] < m[1] ? m[0] + '_' + m[1] : m[1] + '_' + m[0]; }
  function otherOf(m) { return m[0] == me() ? m[1] : m[0]; }
  function likeDoc(p) { return /databases/$(database)/documents/posts/$(p)/likes/$(me()); }
  function myName() { return get(/databases/$(database)/documents/users/$(me())).data.username; }
  function chatMembers(c) { return get(/databases/$(database)/documents/chats/$(c)).data.members; }

  match /usernames/{n} {
   allow read: if signedIn();
   allow create: if signedIn() && n.matches('^[a-z0-9_]{3,20}$')
     && request.resource.data.keys().hasOnly(['uid']) && request.resource.data.uid == me();
  }
  match /users/{u} {
   allow read: if signedIn();
   allow create: if u == me() && request.resource.data.uid == me()
     && request.resource.data.keys().hasOnly(['uid','username','name','bio','college','course','interests','createdAt'])
     && getAfter(/databases/$(database)/documents/usernames/$(request.resource.data.username)).data.uid == me()
     && request.resource.data.name.size() > 0 && request.resource.data.name.size() <= 50
     && request.resource.data.interests.size() <= 10 && request.resource.data.createdAt == request.time;
   allow update: if u == me()
     && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['name','bio','college','course','interests'])
     && request.resource.data.name.size() > 0 && request.resource.data.name.size() <= 50
     && request.resource.data.bio.size() <= 200 && request.resource.data.interests.size() <= 10;
  }
  match /posts/{p} {
   allow read: if signedIn();
   allow create: if signedIn() && request.resource.data.keys().hasOnly(['uid','username','name','text','likeCount','createdAt','mediaUrl','mediaType'])
     && request.resource.data.uid == me() && request.resource.data.username == myName()
     && request.resource.data.text is string && request.resource.data.text.size() <= 1000
     && (request.resource.data.text.size() > 0 || (request.resource.data.keys().hasAll(['mediaUrl','mediaType']) && request.resource.data.mediaUrl is string && request.resource.data.mediaType in ['image','video']))
     && request.resource.data.likeCount == 0 && request.resource.data.createdAt == request.time;
   allow update: if signedIn() && (
     (resource.data.uid == me() && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['text','edited'])
       && request.resource.data.text.size() > 0 && request.resource.data.text.size() <= 1000)
     || (request.resource.data.diff(resource.data).affectedKeys().hasOnly(['likeCount']) && (
       (!exists(likeDoc(p)) && existsAfter(likeDoc(p)) && request.resource.data.likeCount == resource.data.likeCount + 1)
       || (exists(likeDoc(p)) && !existsAfter(likeDoc(p)) && request.resource.data.likeCount == resource.data.likeCount - 1))));
   allow delete: if resource.data.uid == me();
   match /likes/{u} {
    allow read: if signedIn();
    allow create: if u == me() && getAfter(/databases/$(database)/documents/posts/$(p)).data.likeCount
      == get(/databases/$(database)/documents/posts/$(p)).data.likeCount + 1;
    allow delete: if u == me() && getAfter(/databases/$(database)/documents/posts/$(p)).data.likeCount
      == get(/databases/$(database)/documents/posts/$(p)).data.likeCount - 1;
   }
   match /comments/{c} {
    allow read: if signedIn();
    allow create: if request.resource.data.keys().hasOnly(['uid','username','text','createdAt'])
      && request.resource.data.uid == me() && request.resource.data.username == myName()
      && request.resource.data.text.size() > 0 && request.resource.data.text.size() <= 500
      && request.resource.data.createdAt == request.time;
    allow delete: if resource.data.uid == me()
      || get(/databases/$(database)/documents/posts/$(p)).data.uid == me();
   }
  }
  match /stories/{storyId} {
   allow read: if signedIn() && resource.data.expiresAt > request.time;
   allow create: if signedIn()
     && request.resource.data.keys().hasOnly(['uid','username','name','mediaUrl','mediaType','caption','createdAt','expiresAt'])
     && request.resource.data.uid == me() && request.resource.data.username == myName()
     && request.resource.data.mediaUrl is string && request.resource.data.mediaType in ['image','video']
     && request.resource.data.caption is string && request.resource.data.caption.size() <= 200
     && request.resource.data.createdAt == request.time
     && request.resource.data.expiresAt > request.time
     && request.resource.data.expiresAt <= request.time + duration.value(25, 'h');
   allow delete: if signedIn() && resource.data.uid == me();
   allow update: if false;
  }
  match /requests/{id} {
   allow read, delete: if resource.data.from == me() || resource.data.to == me();
   allow create: if request.resource.data.keys().hasOnly(['from','to','createdAt'])
     && request.resource.data.from == me() && request.resource.data.to != me()
     && id == me() + '_' + request.resource.data.to && request.resource.data.createdAt == request.time;
  }
  match /friendships/{id} {
   allow read, delete: if me() in resource.data.members;
   allow create: if request.resource.data.keys().hasOnly(['members','createdAt'])
     && request.resource.data.members.size() == 2 && me() in request.resource.data.members
     && id == pairId(request.resource.data.members)
     && exists(/databases/$(database)/documents/requests/$(otherOf(request.resource.data.members) + '_' + me()));
  }
  match /chats/{c} {
   allow get: if me() in c.split('_');
   allow list: if me() in resource.data.members;
   allow create: if request.resource.data.keys().hasOnly(['members','type','createdAt','lastAt','lastMessage','lastSender','lastRead','typing'])
     && request.resource.data.members.size() == 2 && me() in request.resource.data.members
     && c == pairId(request.resource.data.members)
     && exists(/databases/$(database)/documents/friendships/$(c));
   allow update: if me() in resource.data.members
     && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['lastMessage','lastAt','lastSender','lastRead','typing']);
   match /messages/{m} {
    allow read: if me() in chatMembers(c);
    allow create: if me() in chatMembers(c)
      && exists(/databases/$(database)/documents/friendships/$(c))
      && request.resource.data.keys().hasOnly(['senderId','text','createdAt'])
      && request.resource.data.senderId == me()
      && request.resource.data.text is string && request.resource.data.text.size() > 0 && request.resource.data.text.size() <= 1000
      && request.resource.data.createdAt == request.time;
    allow delete: if resource.data.senderId == me();
   }
  }

  match /calls/{callId} {
    allow create: if signedIn()
      && request.resource.data.keys().hasOnly(['callerUid','calleeUid','chatId','kind','status','roomName','createdAt','updatedAt'])
      && request.resource.data.callerUid == me()
      && request.resource.data.calleeUid is string && request.resource.data.calleeUid != me()
      && request.resource.data.kind in ['audio','video'] && request.resource.data.status == 'ringing'
      && request.resource.data.roomName is string
      && exists(/databases/$(database)/documents/friendships/$(request.resource.data.chatId))
      && me() in get(/databases/$(database)/documents/friendships/$(request.resource.data.chatId)).data.members;
    allow read: if signedIn() && (resource.data.callerUid == me() || resource.data.calleeUid == me());
    allow update: if signedIn() && (resource.data.callerUid == me() || resource.data.calleeUid == me())
      && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['status','updatedAt'])
      && request.resource.data.status in ['ringing','accepted','rejected','ended','missed'];
    allow delete: if signedIn() && (resource.data.callerUid == me() || resource.data.calleeUid == me());
  }

 }
}

==================== LIMITS ====================
Firestore-only media: photos are compressed and stored inline in Firestore; videos are limited to 350 KB per clip due to the 1 MiB document limit. Instagram-like features: photo/video feed posts, likes/comments, 24-hour photo/video stories, profile pages, friend requests and direct chat. Still not built: reels editor, explore/recommendation ranking, DMs with media, story reactions/viewer lists, notifications/FCM, group chat, block/report, or shareable post URLs. LiveKit requires a deployed secure token backend; incoming-call accept/reject and call-state synchronization are not yet implemented.
Deleting a post leaves its likes/comments subcollection docs behind (unreachable from the UI). Messages are NOT end-to-end encrypted.
Typing indicator uses device clocks, so a badly wrong clock can hide it. Test the rules with the Firebase Emulator Suite before real launch.
